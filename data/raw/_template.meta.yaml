  kind: drug  # drug | stress | genotype | pet_measure | microdialysis
  drug: "methylphenidate"
  dose: "20 mg"
  formulation: "immediate release"
  time_post: "60 minutes"
  target: "DAT"  # DAT | NET | D1 | D2 | a2a | b1

effect_type: cohens_d  # cohens_d | hedges_g | r | beta | mean_diff | raw
extraction_method: table  # table | supplement | digitized | reported_effect | computed

notes: "Additional details about extraction or caveats"
quality_flags: []  # e.g., [high_risk_bias, unclear_units, mixed_population]
