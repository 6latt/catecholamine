paper_key: your_paper_key_here

citation:
  title: "Full paper title"
  year: 2024
  doi: "10.1234/example.doi"
  pmid: "12345678"
  journal: "Journal Name"

species: human  # human | rodent | primate | in_vitro | mixed
population: control  # control | adhd | mdd | anxiety | asd | schizophrenia | etc

